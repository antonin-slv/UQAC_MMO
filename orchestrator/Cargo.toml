[package]
name = "orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
bollard = "0.21"
game_sockets = { path = "../game_sockets" }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
winapi = { version = "0.3", features = ["winerror", "minwindef", "winbase"] }
redis = { version = "1.2.1", features = ["tokio-comp"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
shared_replication = { path = "../shared_replication" }
bincode = "1.3"
bytes = "1.11.1"