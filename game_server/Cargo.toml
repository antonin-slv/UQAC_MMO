[package]
name = "game_server"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1", features = ["v4"] }
game_sockets = { path = "../game_sockets" }
shared_replication = { path = "../shared_replication" }
bevy = "0.18.1"
#bevy_rapier2d = {version = "0.33.0" }

bincode = "1.3"
bytes = "1.11.1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3


