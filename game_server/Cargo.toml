[package]
name = "game_server"
version = "0.1.0"
edition = "2024"

[dependencies]
#dotenv is a common dependency :
dotenv = {workspace = true }
game_sockets = { path = "../game_sockets" }
shared_replication = { path = "../shared_replication" }
uuid = { version = "1", features = ["v4"] }
bevy = { version = "0.18.1", default-features = false }
#bevy_rapier2d = {version = "0.33.0" }

bincode = "1.3"
bytes = "1.11.1"
serde_json = "1.0.149"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3


