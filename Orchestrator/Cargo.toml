[package]
name = "Orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
bollard = "0.15" # Version stable actuelle en 2026
futures-util = "0.3"
winapi = { version = "0.3", features = ["winerror", "minwindef", "winbase"] }
redis = { version = "1.2.1", features = ["tokio-comp"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"