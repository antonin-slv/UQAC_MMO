networks:
  mmo_network:
    driver: bridge
    name: mmo_network

services:
  game_server:
    build:
      context: .
      dockerfile: crates/game_server/Dockerfile
    image: game-server
    container_name: game_server_template
    command: [ "echo", "✅ Image game-server compilée et prête pour l'orchestrateur !" ]
    restart: "no"
    networks:
      - mmo_network

  db:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mmo_network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mmo_network

  orchestrator:
    build:
      context: .
      dockerfile: crates/orchestrator/Dockerfile
    image: orchestrator
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3631:3631"
    depends_on:
      redis:
        condition: service_started
      broker:
        condition: service_started
      game_server:
        condition: service_completed_successfully
    restart: always
    container_name: orchestrator
    networks:
      - mmo_network

  gate_keeper:
    build:
      context: .
      dockerfile: crates/gate_keeper/Dockerfile
    image: gate-keeper
    env_file:
      - .env
    ports:
      - "3630:3630"
    depends_on:
      - orchestrator
      - db
    restart: always
    container_name: gate-keeper
    networks:
      - mmo_network

  dbgate:
    image: dbgate/dbgate
    ports:
      - "8081:3000"
    networks:
      - mmo_network
    environment:
      CONNECTIONS: con1,con2
      LABEL_con1: Postgres
      ENGINE_con1: postgres@dbgate-plugin-postgres
      SERVER_con1: db
      USER_con1: ${POSTGRES_USER}
      PASSWORD_con1: ${POSTGRES_PASSWORD}
      PORT_con1: 5432
      DATABASE_con1: ${POSTGRES_DB}
      LABEL_con2: Redis
      ENGINE_con2: redis@dbgate-plugin-redis
      SERVER_con2: redis
      PORT_con2: 6379
  broker:
    build:
      context: .
      dockerfile: crates/broker/Dockerfile
    image: broker
    env_file:
      - .env
    ports:
      - "3632:3632/udp"
      - "3633:3633/udp"
    restart: always
    container_name: broker
    networks:
      - mmo_network
  spatial_server:
    build:
      context: .
      dockerfile: crates/spatial_server/Dockerfile
    image: spatial-server
    env_file:
      - .env
    ports:
      - "3634:3634/udp"
    restart: always
    container_name: spatial_server
    networks:
      - mmo_network
  #mock_spatial_auth_server:
  #  build:
  #    context: .
  #    dockerfile: crates/mock_spatial_auth_server/Dockerfile
  #  image: mock_spatial_auth_server
  #  env_file:
  #    - .env
