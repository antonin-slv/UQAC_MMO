networks:
  mmo_network:
    driver: bridge
    name: mmo-network

services:
  game_server:
    build:
      context: .
      dockerfile: game_server/Dockerfile
    image: game-server

  db:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mmo-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mmo-network

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    image: orchestrator
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3631:3631"
    depends_on:
      - redis
      - game_server
    restart: always
    container_name: orchestrator
    networks:
      - mmo-network

  gate_keeper:
    build:
      context: .
      dockerfile: gate_keeper/Dockerfile
    image: gate-keeper
    env_file:
      - .env
    ports:
      - "3630:3630"
    depends_on:
      - orchestrator
      - db
    restart: always
    container_name: gate-keeper
    networks:
      - mmo-network

  dbgate:
    image: dbgate/dbgate
    ports:
      - "8081:3000"
    networks:
      - mmo-network
    environment:
      CONNECTIONS: con1,con2
      LABEL_con1: Postgres
      ENGINE_con1: postgres@dbgate-plugin-postgres
      SERVER_con1: db
      USER_con1: ${POSTGRES_USER}
      PASSWORD_con1: ${POSTGRES_PASSWORD}
      PORT_con1: 5432
      DATABASE_con1: ${POSTGRES_DB}
      LABEL_con2: Redis
      ENGINE_con2: redis@dbgate-plugin-redis
      SERVER_con2: redis
      PORT_con2: 6379

volumes:
  postgres_data:
  redis_data: