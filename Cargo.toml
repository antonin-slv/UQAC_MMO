[workspace]
resolver = "3"
members = [
    "game_client",
    "game_server",
    "gate_keeper",
    "orchestrator",
    "shared_replication",
    "game_sockets", "broker"]


#common dependencies
[workspace.dependencies]
game_sockets = { path = "game_sockets" }
shared_replication = { path = "shared_replication" }

# --- Moteurs et Réseau ---
bevy = "0.18.1"
tokio = "1.52.3"
rocket = { version = "0.5", features = ["json"] }
redis = { version = "1.2.1", features = ["tokio-comp"] }

# --- Utilitaires communs ---
anyhow = "1.0"
dotenv = "0.13.0"
uuid = { version = "1", features = ["v4"] }

# --- Sérialisation / Données ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
bincode = "1.3"
bytes = "1.11.1"
