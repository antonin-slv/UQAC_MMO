[workspace]
resolver = "3"
members = [
    "crates/game_client",
    "crates/game_server",
    "crates/gate_keeper",
    "crates/orchestrator",
    "crates/shared_replication",
    "crates/game_sockets",
    "crates/spatial_server",
    "crates/broker",
    "crates/mock_spatial_auth_server"]


#common dependencies
[workspace.dependencies]
game_sockets = { path = "crates/game_sockets" }
shared_replication = { path = "crates/shared_replication" }

# --- Moteurs et Réseau ---
bevy = "0.18.1"
tokio = "1.52.3"
rocket = { version = "0.5", features = ["json"] }
redis = { version = "1.2.1", features = ["tokio-comp"] }

# --- Utilitaires communs ---
anyhow = "1.0"
dotenv = "0.13.0"
uuid = { version = "1", features = ["v4"] }

# --- Sérialisation / Données ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
bincode = "1.3"
bytes = "1.11.1"
